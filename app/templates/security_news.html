{% extends "base.html" %}
{% block title %}보안뉴스 · securewebproject{% endblock %}
{% block content %}
<h1 class="page-title">Security News</h1>
<p class="page-subtitle">데일리시큐 긴급속보 · 보안뉴스 사건·사고 · KCERT 보안공지 — 오늘자 기사 (1시간 주기 자동 갱신)</p>

<div class="panel">
  <h2>
    보안 기사 (오늘)
    <button id="refresh-btn" class="btn-inline">지금 갱신</button>
    <button id="save-btn" class="btn-inline">저장 +</button>
  </h2>
  <div class="news-filters" id="news-filters">
    <button class="btn-inline active" data-src="all">전체</button>
    <button class="btn-inline" data-src="dailysecu">데일리시큐</button>
    <button class="btn-inline" data-src="boannews">보안뉴스</button>
    <button class="btn-inline" data-src="kcert">KCERT</button>
  </div>
  <div id="status" class="muted" style="margin:10px 0;">불러오는 중...</div>
  <ul class="news-list" id="news-list"></ul>
</div>

<div class="panel">
  <h2>보안 기사 (보관)</h2>
  <div id="archive-status" class="muted" style="margin-bottom:10px;">불러오는 중...</div>
  <ul class="news-list" id="archive-list"></ul>
</div>
{% endblock %}
{% block scripts %}
<script>
const SRC_LABEL = { dailysecu: '데일리시큐', boannews: '보안뉴스', kcert: 'KCERT' };
let allRows = [];
let activeSrc = 'all';

function fmt(ts) { return ts ? new Date(ts).toLocaleString('ko-KR', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}) : ''; }
function esc(s) { return (s ?? '').toString().replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
function isTodayTs(ts) {
  if (!ts) return false;
  const d = new Date(ts), n = new Date();
  return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
}

function render() {
  const list = document.getElementById('news-list');
  const status = document.getElementById('status');
  const rows = activeSrc === 'all' ? allRows : allRows.filter(n => n.source === activeSrc);
  if (!allRows.length) { list.innerHTML = ''; status.textContent = '표시할 기사가 없습니다.'; return; }
  const hasToday = allRows.some(n => isTodayTs(n.published_at));
  const note = hasToday ? '오늘자' : '오늘자 기사 없음 — 최신';
  status.textContent = `${note} · 표시 ${rows.length}건 / 전체 ${allRows.length}건`;
  list.innerHTML = rows.map(n => `
    <li>
      <input type="checkbox" class="news-check" data-id="${n.id}" style="margin-right:8px;width:auto;cursor:pointer;" ${n.is_archived ? 'disabled title="이미 보관됨"' : ''}>
      <span class="news-time">${fmt(n.published_at)}</span>
      <span class="news-src src-${esc(n.source)}">${SRC_LABEL[n.source] || esc(n.source)}</span>
      <a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>
      ${n.is_archived ? '<span class="pill info" style="font-size:10px;">보관됨</span>' : ''}
    </li>`).join('');
}

async function loadNews() {
  try {
    allRows = await fetch('/api/security-news?today_only=true&auto_refresh=true&fallback_recent=true')
      .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); });
    render();
  } catch (err) {
    document.getElementById('status').textContent = '불러오기 실패 (' + err.message + ') — DB가 실행 중인지 확인하세요';
  }
}

async function loadArchive() {
  const list = document.getElementById('archive-list');
  const status = document.getElementById('archive-status');
  try {
    const rows = await fetch('/api/security-news/archived').then(r => { if(!r.ok) throw new Error(r.status); return r.json(); });
    if (!rows.length) { list.innerHTML = ''; status.textContent = '보관된 기사가 없습니다.'; return; }
    status.textContent = `${rows.length}건`;
    list.innerHTML = rows.map(n => `
      <li id="archive-item-${n.id}">
        <span class="news-time">${fmt(n.published_at)}</span>
        <span class="news-src src-${esc(n.source)}">${SRC_LABEL[n.source] || esc(n.source)}</span>
        <a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>
        <button type="button" class="btn-inline archive-del-btn" data-id="${n.id}" style="margin-left:auto;color:var(--accent);">−</button>
      </li>`).join('');
  } catch (err) {
    status.textContent = '불러오기 실패 (' + err.message + ')';
  }
}

document.getElementById('archive-list').addEventListener('click', async (e) => {
  const btn = e.target.closest('.archive-del-btn');
  if (!btn) return;
  const id = btn.getAttribute('data-id');
  btn.disabled = true;
  try {
    await fetch(`/api/security-news/${id}/archive`, { method: 'DELETE' });
    document.getElementById(`archive-item-${id}`)?.remove();
    const remaining = document.querySelectorAll('#archive-list li').length;
    document.getElementById('archive-status').textContent = remaining ? `${remaining}건` : '보관된 기사가 없습니다.';
    const row = allRows.find(r => r.id === Number(id));
    if (row) { row.is_archived = false; render(); }
  } catch (err) {
    alert('삭제 실패: ' + err.message);
    btn.disabled = false;
  }
});

document.getElementById('save-btn').addEventListener('click', async () => {
  const checked = [...document.querySelectorAll('.news-check:checked')].map(c => Number(c.getAttribute('data-id')));
  if (!checked.length) { alert('저장할 기사를 선택하세요.'); return; }
  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = '저장 중...';
  let saved = 0;
  for (const id of checked) {
    try {
      await fetch(`/api/security-news/${id}/archive`, { method: 'POST' });
      const row = allRows.find(r => r.id === id);
      if (row) row.is_archived = true;
      saved++;
    } catch { /* 개별 실패는 무시 */ }
  }
  btn.disabled = false; btn.textContent = '저장 +';
  render();
  await loadArchive();
  if (saved) document.getElementById('status').textContent = `${saved}건 보관함에 저장됐습니다.`;
});

document.getElementById('news-filters').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-src]');
  if (!btn) return;
  activeSrc = btn.dataset.src;
  document.querySelectorAll('#news-filters button').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

document.getElementById('refresh-btn').addEventListener('click', async (e) => {
  e.target.disabled = true; e.target.textContent = '갱신 중...';
  try {
    const r = await fetch('/api/security-news/refresh', { method: 'POST' }).then(r => r.json());
    document.getElementById('status').textContent = `갱신 완료 — 신규 ${r.new_count}건`;
    await loadNews();
    if (window.refreshBadge) window.refreshBadge();
  } catch (err) {
    document.getElementById('status').textContent = '갱신 실패: ' + err.message;
  } finally {
    e.target.disabled = false; e.target.textContent = '지금 갱신';
  }
});

loadNews();
loadArchive();
</script>
{% endblock %}
